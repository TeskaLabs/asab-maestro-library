define:
  type: rc/descriptor
  name: ASAB Discovery

descriptor:
  image: docker.teskalabs.com/asab/asab-discovery

  volumes:
    # For a persistency of the configuration
    - "{{SITE}}/{{INSTANCE_ID}}/conf:/conf:ro"

  # This is critical service
  restart: always

asab:
  configname: conf/asab-discovery.conf
  config:
    web:
      listen: "{{INTERNAL_NETWORK_IP}} 8897"

nginx:
  api: 8897
  https:
    # Signed baseline/counters CSV download; skip oauth2 introspect on this path
    location ~ ^/api/asab-discovery/~/.*\/export\/[0-9a-fA-F]+\/[0-9a-fA-F]+$:
      - rewrite /api/asab-discovery/(.*) /$1 break
      - proxy_pass http://{{NODE_ID}}:8897
