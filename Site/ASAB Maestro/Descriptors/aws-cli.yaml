---
define:
  type: rc/descriptor
  name: AWS CLI

descriptor:
  image: amazon/aws-cli
  volumes:
    - "{{SITE}}/{{INSTANCE_ID}}/conf/.aws:/root/.aws:ro"  # Optional configuration file for AWS CLI
    - "{{SLOW_STORAGE}}:/data/hdd:ro"  # Read only mount of slow storage

  entrypoint: ["/bin/sh", "-c"]
  command: ["sleep infinity"]
