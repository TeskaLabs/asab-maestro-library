define:
  type: rc/descriptor
  name: ASAB Pyppeteer

descriptor:
  image: docker.teskalabs.com/asab/asab-pyppeteer

  volumes:
    # For a persistency of the configuration
    - "{{SITE}}/{{INSTANCE_ID}}/conf:/conf:ro"


asab:
  configname: conf/asab-pyppeteer.conf
  config:
    auth:
      public_keys_url: http://seacat-auth:8900/.well-known/jwks.json
    pyppeteer:
      ignore_certificate_errors: 1
      url_white_list: http://nginx:8890

nginx:
  api: 8895
