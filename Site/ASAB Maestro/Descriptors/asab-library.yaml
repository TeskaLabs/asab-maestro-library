define:
  type: rc/descriptor
  name: ASAB Library

secrets:
  EXPORT_SIGNATURE_SECRET: {}

descriptor:
  image: docker.teskalabs.com/asab/asab-library

  volumes:
    # For a persistency of the configuration
    - "{{SITE}}/{{INSTANCE_ID}}/conf:/conf:ro"
    # For persistency of fultext-search data
    - "{{SLOW_STORAGE}}/{{INSTANCE_ID}}:/var/lib/asab-library"
    # Read-only cache of remote library providers
    - "{{SLOW_STORAGE}}/library/cache:/library/cache:ro"

  # This is critical service
  restart: always

asab:
  configname: conf/asab-library.conf
  config:
    auth:
      public_keys_url: http://seacat-auth:8900/.well-known/jwks.json
    tenants:
      tenant_url: "{{SEACAT_AUTH_PUBLIC}}/tenant"
    library:
      cache_dir: /library/cache
      export_signature_secret: "{{EXPORT_SIGNATURE_SECRET}}"

nginx:
  api: 8893
  https:
    # Direct browser downloads use short-lived signatures instead of OAuth headers.
    location /api/asab-library/library/export/:
      - rewrite /api/asab-library/(.*) /$1 break
      - proxy_pass http://{{NODE_ID}}:8893
